<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>최 부장 자료실 | 점령된 자료실</title>
  <meta name="theme-color" content="#101a28">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; }
    a { color: #8ad8df; }

    .auth-bar { display: flex; align-items: center; gap: 12px; margin: 26px 0; padding: 14px 18px;
      border: 1px solid #2d4460; border-radius: 14px; background: #1a2a3d; font-size: 15px; }
    .auth-bar .user-email { color: #8ad8df; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .btn-logout { padding: 8px 18px; background: #2d4460; border: none; border-radius: 8px;
      color: #ecf4ff; font-size: 14px; cursor: pointer; font-family: inherit; }
    .btn-logout:hover { background: #3a5577; }

    .login-box, .note-form { margin: 26px 0; padding: 24px; border: 1px solid #2d4460; border-radius: 14px; background: #1a2a3d; }
    .note-form { margin-top: 0; }
    .login-box h2, .note-form h2 { margin: 0 0 20px; font-size: 20px; }
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .field label { font-size: 14px; color: #8ad8df; }
    .field input, .field textarea { padding: 10px 12px; background: #101a28; border: 1px solid #2d4460;
      border-radius: 8px; color: #ecf4ff; font-size: 15px; font-family: inherit; }
    .field textarea { resize: vertical; line-height: 1.5; }
    .field input:focus, .field textarea:focus { outline: none; border-color: #8ad8df; }
    .btn-login { width: 100%; padding: 11px; background: #8ad8df22; border: 1px solid #8ad8df66;
      color: #8ad8df; border-radius: 8px; font-size: 16px; cursor: pointer; font-family: inherit; }
    .btn-login:hover:not(:disabled) { background: #8ad8df33; }
    .btn-login:disabled { opacity: .5; cursor: default; }
    .error-msg { margin-top: 12px; padding: 10px 14px; border-radius: 8px;
      background: #612a3544; border: 1px solid #d07384; color: #ffe3e8; font-size: 14px; }

    .panel { border: 0; margin: 0; padding: 0; min-width: 0; }
    .note-form .btn-login { margin-top: 4px; }
    .note-body { display: block; white-space: pre-wrap; overflow-wrap: anywhere; }
    .note-actions { display: flex; gap: 8px; margin-top: 14px; }
    .btn { padding: 7px 16px; background: #22364d; border: 1px solid #2d4460; border-radius: 8px;
      color: #ecf4ff; font-size: 14px; cursor: pointer; font-family: inherit; }
    .btn:hover:not(:disabled) { background: #2d4460; }
    .btn:disabled { opacity: .5; cursor: default; }
    .btn-accent { border-color: #8ad8df66; background: #8ad8df22; color: #8ad8df; }
    .btn-accent:hover:not(:disabled) { background: #8ad8df33; }
    .btn-danger { border-color: #d0738488; color: #ffb4c0; }
    li .field { margin-bottom: 10px; }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 11단계 접속 앱</div>
    <h1>점령된 자료실</h1>
    <div id="gate" class="notice" role="status">서버가 이 기기의 승인을 확인하는 중입니다. 확인되기 전에는 로그인 화면도 자료도 표시하지 않습니다.</div>
    <div id="app"></div>
    <p><a href="/">접속 화면으로 돌아가기</a></p>
  </main>

  <script type="module">
    // 서버가 이 기기를 승인했다고 확인하기 전에는 자료실 화면 코드(/vault-app.js)를 불러오지 않는다.
    // 그래서 승인 전에는 로그인 폼·메모 목록·편집 화면이 없고, 메모 요청도 보내지 않는다.
    const gate = document.getElementById('gate');
    const root = document.getElementById('app');
    let running = null;

    async function serverApproved() {
      if (!navigator.onLine) return false;
      try {
        const response = await fetch('/api/device/status', { cache: 'no-store' });
        const data = await response.json();
        return response.ok && data?.connected === true && data?.approved === true;
      } catch {
        return false;
      }
    }

    function lock(message) {
      running?.stop();
      running = null;
      root.replaceChildren();
      gate.textContent = message;
      gate.classList.remove('hidden');
    }

    async function check() {
      const approved = await serverApproved();
      if (!approved) {
        lock(navigator.onLine
          ? '서버가 이 기기를 승인했다고 확인하지 못했습니다. 승인 전에는 자료가 표시되지 않습니다.'
          : '오프라인입니다. 서버에 다시 연결되면 승인 상태를 새로 확인합니다. 그동안 자료는 표시되지 않습니다.');
        return false;
      }
      if (!running) {
        gate.classList.add('hidden');
        const { start } = await import('/vault-app.js');
        running = start(root, { isApproved: check });
      }
      return true;
    }

    window.addEventListener('online', check);
    window.addEventListener('offline', check);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
    setInterval(check, 30000);
    check();
  </script>
</body>
</html>
