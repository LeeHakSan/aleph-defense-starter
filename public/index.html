<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 점령된 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; }

    .auth-bar { display: flex; align-items: center; gap: 12px; margin: 26px 0; padding: 14px 18px;
      border: 1px solid #2d4460; border-radius: 14px; background: #1a2a3d; font-size: 15px; }
    .auth-bar .user-email { color: #8ad8df; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .btn-logout { padding: 8px 18px; background: #2d4460; border: none; border-radius: 8px;
      color: #ecf4ff; font-size: 14px; cursor: pointer; font-family: inherit; }
    .btn-logout:hover { background: #3a5577; }

    .login-box { margin: 26px 0; padding: 24px; border: 1px solid #2d4460; border-radius: 14px; background: #1a2a3d; }
    .login-box h2 { margin: 0 0 20px; font-size: 20px; }
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .field label { font-size: 14px; color: #8ad8df; }
    .field input { padding: 10px 12px; background: #101a28; border: 1px solid #2d4460;
      border-radius: 8px; color: #ecf4ff; font-size: 15px; font-family: inherit; }
    .field input:focus { outline: none; border-color: #8ad8df; }
    .btn-login { width: 100%; padding: 11px; background: #8ad8df22; border: 1px solid #8ad8df66;
      color: #8ad8df; border-radius: 8px; font-size: 16px; cursor: pointer; font-family: inherit; }
    .btn-login:hover:not(:disabled) { background: #8ad8df33; }
    .btn-login:disabled { opacity: .5; cursor: default; }
    .error-msg { margin-top: 12px; padding: 10px 14px; border-radius: 8px;
      background: #612a3544; border: 1px solid #d07384; color: #ffe3e8; font-size: 14px; }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 3단계 로그인 방어</div>
    <h1>점령된 자료실</h1>
    <p>지금은 보호 장치가 없는 상태입니다. 아래 기록은 모두 실습을 위해 만든 가상 자료입니다.</p>

    <!-- 로그아웃 상태 -->
    <div id="login-section">
      <div class="notice">로그인하지 않은 방문자도 자료를 볼 수 있습니다. 공개 범위를 확인하고, 다음 제작 단계에서 접근을 차례로 막아 주세요.</div>
      <div class="login-box">
        <h2>로그인</h2>
        <div class="field">
          <label for="email">이메일</label>
          <input type="email" id="email" autocomplete="email" placeholder="you@example.com">
        </div>
        <div class="field">
          <label for="password">비밀번호</label>
          <input type="password" id="password" autocomplete="current-password">
        </div>
        <button class="btn-login" id="login-btn">로그인</button>
        <div class="error-msg hidden" id="error-msg" role="alert"></div>
      </div>
    </div>

    <!-- 로그인 상태 -->
    <div id="authed-section" class="hidden">
      <div class="auth-bar">
        <span class="user-email" id="user-email"></span>
        <button class="btn-logout" id="logout-btn">로그아웃</button>
      </div>
      <ul id="notes" aria-live="polite"><li>가상 자료를 불러오는 중입니다.</li></ul>
    </div>
  </main>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const SUPABASE_URL = 'https://wzjcxokorpaemarrymzp.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind6amN4b2tvcnBhZW1hcnJ5bXpwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyNzcwOTcsImV4cCI6MjEwNjg1MzA5N30.gU-ccSFJsNnZCzv5IHKRMUlwbs5AZcHXrOl7YSpnh9M';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const loginSection  = document.getElementById('login-section');
    const authedSection = document.getElementById('authed-section');
    const userEmailEl   = document.getElementById('user-email');
    const emailInput    = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const loginBtn      = document.getElementById('login-btn');
    const logoutBtn     = document.getElementById('logout-btn');
    const errorMsg      = document.getElementById('error-msg');
    const notesList     = document.getElementById('notes');

    function showUI(user) {
      if (user) {
        loginSection.classList.add('hidden');
        authedSection.classList.remove('hidden');
        userEmailEl.textContent = user.email;
        loadNotes(user);
      } else {
        loginSection.classList.remove('hidden');
        authedSection.classList.add('hidden');
      }
    }

    async function loadNotes(user) {
      try {
        const { data: { session } } = await supabase.auth.getSession();
        const headers = session?.access_token
          ? { Authorization: `Bearer ${session.access_token}` }
          : {};
        const res = await fetch('/api/notes', { cache: 'no-store', headers });
        if (!res.ok) throw new Error('자료를 읽을 수 없습니다.');
        const data = await res.json();
        if (!Array.isArray(data.notes)) throw new Error('자료 형식이 맞지 않습니다.');
        notesList.replaceChildren(...data.notes.map(note => {
          const item    = document.createElement('li');
          const title   = document.createElement('strong');
          const content = document.createElement('span');
          title.textContent   = note.title;
          content.textContent = note.content;
          item.append(title, content);
          return item;
        }));
      } catch (err) {
        const item = document.createElement('li');
        item.textContent = err.message;
        notesList.replaceChildren(item);
      }
    }

    // 초기 세션 확인
    const { data: { user } } = await supabase.auth.getUser();
    showUI(user);

    // 세션 변화 구독
    supabase.auth.onAuthStateChange((_event, session) => {
      showUI(session?.user ?? null);
    });

    // 로그인
    loginBtn.addEventListener('click', async () => {
      const email    = emailInput.value.trim();
      const password = passwordInput.value;
      errorMsg.classList.add('hidden');
      errorMsg.textContent = '';
      if (!email || !password) {
        errorMsg.textContent = '이메일과 비밀번호를 모두 입력해 주세요.';
        errorMsg.classList.remove('hidden');
        return;
      }
      loginBtn.disabled    = true;
      loginBtn.textContent = '로그인 중…';
      const { error } = await supabase.auth.signInWithPassword({ email, password });
      loginBtn.disabled    = false;
      loginBtn.textContent = '로그인';
      if (error) {
        errorMsg.textContent = error.message;
        errorMsg.classList.remove('hidden');
      }
    });

    // 로그아웃
    logoutBtn.addEventListener('click', () => supabase.auth.signOut());

    // Enter 키 지원
    [emailInput, passwordInput].forEach(el =>
      el.addEventListener('keydown', e => { if (e.key === 'Enter') loginBtn.click(); })
    );
  </script>
</body>
</html>
